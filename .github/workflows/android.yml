name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip App Folder
      run: |
        unzip app.zip -d app/ || true
        # اگر پوشه‌ها جابه‌جا شده باشند، آن‌ها را در مسیر درست مرتب می‌کند
        if [ -d "app/app" ]; then
          cp -r app/app/* app/
          rm -rf app/app
        fi
        rm -f app.zip
      continue-on-error: true

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew :app:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
